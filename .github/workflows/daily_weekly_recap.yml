on:
  schedule:
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Date to score (YYYY-MM-DD), leave blank for yesterday'
        required: false
        default: ''

jobs:
  score_results:
    if: github.event.schedule == '30 10 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Score results
        run: python auto_results.py ${{ github.event.inputs.target_date || 'yesterday' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}