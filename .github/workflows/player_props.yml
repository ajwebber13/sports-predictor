name: Player Props

on:
  schedule:
    - cron: '7 15 * * *'    # 10:07 AM CT daily — fetch today's props
    - cron: '22 15 * * *'   # 10:22 AM CT daily — send props alert (props already fetched)
  workflow_dispatch:

jobs:
  fetch_props:
    if: github.event.schedule == '7 15 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch today's props
        run: python fetch_prizepicks_props.py --sport wnba
        env:
          # No Discord webhook needed here — this job only fetches and
          # saves prop data, it never sends a message.
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

  fetch_mlb_props:
    if: github.event.schedule == '7 15 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch today's MLB props
        run: python fetch_prizepicks_props.py --sport mlb
        env:
          # No Discord webhook needed here either — fetch-only job.
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

  props_alert:
    needs: fetch_props
    if: always() && (github.event.schedule == '22 15 * * *' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send props alert
        run: python wnba_props_alert.py
        env:
          # DISCORD_WEBHOOK_WNBA added 2026-07-23 — wnba_props_alert.py
          # now routes to get_webhook_for_sport("wnba") first, falling
          # back to DISCORD_WEBHOOK_PROPS below only if that's not set.
          DISCORD_WEBHOOK_WNBA: ${{ secrets.DISCORD_WEBHOOK_WNBA }}
          DISCORD_WEBHOOK_PROPS: ${{ secrets.DISCORD_WEBHOOK_PROPS }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

  mlb_props_alert:
    needs: fetch_mlb_props
    if: always() && (github.event.schedule == '22 15 * * *' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send MLB props alert
        run: python mlb_props_alert.py
        env:
          # DISCORD_WEBHOOK_MLB added 2026-07-23 — mlb_props_alert.py
          # now routes to get_webhook_for_sport("mlb") first, falling
          # back to DISCORD_WEBHOOK_PROPS below only if that's not set.
          DISCORD_WEBHOOK_MLB: ${{ secrets.DISCORD_WEBHOOK_MLB }}
          DISCORD_WEBHOOK_PROPS: ${{ secrets.DISCORD_WEBHOOK_PROPS }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
