name: Check Power Rankings

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport to rank"
        required: true
        default: "wnba"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ranking_engine.py
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python ranking_engine.py "${{ github.event.inputs.sport }}"
