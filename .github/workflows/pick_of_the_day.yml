name: Pick of the Day

on:
  schedule:
    - cron: '0 16 * * *'   # 11:00 AM CT daily
  workflow_dispatch:

jobs:
  send_pick:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send Pick of the Day
        run: python pick_of_the_day.py
        env:
          # 5 per-sport webhooks added 2026-07-23 — pick_of_the_day.py
          # can send a Lock/Projection/Prop message for any sport with
          # a qualifying pick in one run, each routed through
          # get_webhook_for_sport(sport). Same reasoning as
          # morning_run.yml/daily_recap.yml.
          DISCORD_WEBHOOK_WNBA: ${{ secrets.DISCORD_WEBHOOK_WNBA }}
          DISCORD_WEBHOOK_MLB: ${{ secrets.DISCORD_WEBHOOK_MLB }}
          DISCORD_WEBHOOK_NFL: ${{ secrets.DISCORD_WEBHOOK_NFL }}
          DISCORD_WEBHOOK_CFB: ${{ secrets.DISCORD_WEBHOOK_CFB }}
          DISCORD_WEBHOOK_NCAAB: ${{ secrets.DISCORD_WEBHOOK_NCAAB }}
          # Fallback for nba (no dedicated channel yet) and as a
          # safety net if a sport-specific secret above isn't set.
          DISCORD_WEBHOOK_GAME_PICKS: ${{ secrets.DISCORD_WEBHOOK_GAME_PICKS }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Upload daily-intelligence.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-intelligence
          path: daily-intelligence.json

      - name: Push to cp-sports-site
        env:
          CP_SITE_PAT: ${{ secrets.CP_SITE_PAT }}
        run: |
          if [ -z "$CP_SITE_PAT" ]; then
            echo "CP_SITE_PAT secret not set — skipping auto-push to cp-sports-site."
            exit 0
          fi
          git clone "https://x-access-token:${CP_SITE_PAT}@github.com/ajwebber13/cp-sports-site.git" site-repo
          cp daily-intelligence.json site-repo/data/daily-intelligence.json
          cd site-repo
          git config user.name "C&P Analytics Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily-intelligence.json
          if git diff --staged --quiet; then
            echo "No change in daily intelligence since last run — nothing to push."
          else
            git commit -m "Auto-update daily intelligence $(date -u +%Y-%m-%d)"
            git push origin main
            echo "Pushed updated daily-intelligence.json to cp-sports-site"
          fi
