name: Weekly Recap

on:
  schedule:
    - cron: '0 14 * * 0'    # 9 AM CT Sunday — send weekly recap
  workflow_dispatch:

jobs:
  weekly_recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send weekly recap
        run: python recap_engine.py --weekly
        env:
          # 5 per-sport webhooks added 2026-07-23 — same reasoning as
          # daily_recap.yml: recap_engine.py --weekly (no --sport
          # filter) can send a message for every sport with data in
          # one run.
          DISCORD_WEBHOOK_WNBA: ${{ secrets.DISCORD_WEBHOOK_WNBA }}
          DISCORD_WEBHOOK_MLB: ${{ secrets.DISCORD_WEBHOOK_MLB }}
          DISCORD_WEBHOOK_NFL: ${{ secrets.DISCORD_WEBHOOK_NFL }}
          DISCORD_WEBHOOK_CFB: ${{ secrets.DISCORD_WEBHOOK_CFB }}
          DISCORD_WEBHOOK_NCAAB: ${{ secrets.DISCORD_WEBHOOK_NCAAB }}
          # Fallback if a sport-specific secret above isn't set.
          DISCORD_WEBHOOK_RECAPS: ${{ secrets.DISCORD_WEBHOOK_RECAPS }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
