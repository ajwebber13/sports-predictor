name: Daily Recap

on:
  schedule:
    - cron: '30 11 * * *'   # 6:30 AM CT daily — send daily recap
  workflow_dispatch:

jobs:
  daily_recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send daily recap
        run: python recap_engine.py --daily
        env:
          # 5 per-sport webhooks added 2026-07-23 — recap_engine.py's
          # --daily run (no --sport filter) loops every sport with
          # results and sends each one's recap to its own channel via
          # get_webhook_for_sport(sport). All 5 are needed here, same
          # reasoning as morning_run.yml.
          DISCORD_WEBHOOK_WNBA: ${{ secrets.DISCORD_WEBHOOK_WNBA }}
          DISCORD_WEBHOOK_MLB: ${{ secrets.DISCORD_WEBHOOK_MLB }}
          DISCORD_WEBHOOK_NFL: ${{ secrets.DISCORD_WEBHOOK_NFL }}
          DISCORD_WEBHOOK_CFB: ${{ secrets.DISCORD_WEBHOOK_CFB }}
          DISCORD_WEBHOOK_NCAAB: ${{ secrets.DISCORD_WEBHOOK_NCAAB }}
          # Fallback if a sport-specific secret above isn't set.
          DISCORD_WEBHOOK_RECAPS: ${{ secrets.DISCORD_WEBHOOK_RECAPS }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
