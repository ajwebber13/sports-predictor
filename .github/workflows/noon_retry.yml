name: Noon Retry

on:
  schedule:
    - cron: '0 17 * * *'   # 12:00 PM CT — original noon retry
    - cron: '0 20 * * *'   # 3:00 PM CT — lineup-confirmed pass (scaffolding, see note above)
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run retry (noon or 3pm)
        run: python render_job.py --retry
        env:
          DISCORD_WEBHOOK_GAME_PICKS: ${{ secrets.DISCORD_WEBHOOK_GAME_PICKS }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: Score yesterday's predictions (noon run only)
        if: github.event.schedule == '0 17 * * *' || github.event_name == 'workflow_dispatch'
        run: python auto_results.py yesterday
        env:
          DISCORD_WEBHOOK_GAME_PICKS: ${{ secrets.DISCORD_WEBHOOK_GAME_PICKS }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}