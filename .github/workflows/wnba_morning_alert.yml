name: WNBA Morning Alert

on:
  # Schedule disabled — WNBA now runs through the combined 9:07 AM
  # render_job.py alert instead of this separate digest, to avoid
  # sending two different-looking WNBA messages for the same games.
  # workflow_dispatch below still works for manually running the
  # digest on its own if needed.
  # schedule:
  #   - cron: '30 13 * * *'
  workflow_dispatch:
jobs:
  wnba_alert:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run WNBA slate digest and edge alerts
        run: python telegram_alerts.py --sport wnba
        env:
          # DISCORD_WEBHOOK_WNBA added 2026-07-23 — telegram_alerts.py
          # now routes to the sport's own channel via
          # get_webhook_for_sport("wnba"), falling back to
          # DISCORD_WEBHOOK_GAME_PICKS below only if this isn't set.
          DISCORD_WEBHOOK_WNBA: ${{ secrets.DISCORD_WEBHOOK_WNBA }}
          DISCORD_WEBHOOK_GAME_PICKS: ${{ secrets.DISCORD_WEBHOOK_GAME_PICKS }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
