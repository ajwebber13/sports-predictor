name: Score Results and Props

on:
  schedule:
    - cron: '30 10 * * *'   # 5:30 AM CT daily — score yesterday's games
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Date to score (YYYY-MM-DD), leave blank for yesterday'
        required: false
        default: ''

jobs:
  score_results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Score results
        run: python auto_results.py ${{ github.event.inputs.target_date || 'yesterday' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

  score_props:
    needs: score_results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Score props
        run: python prop_tracker.py --score ${{ github.event.inputs.target_date || 'yesterday' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
