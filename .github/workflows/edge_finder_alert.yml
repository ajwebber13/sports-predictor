name: Edge Finder Alert

on:
  schedule:
    - cron: '30 15 * * *'   # 10:30 AM CT daily - after Player Props fetch (10:07) and alert (10:22)
  workflow_dispatch:

jobs:
  edge_finder_alert:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send Edge Finder alert
        run: python edge_finder_alert.py --sport wnba --top 5 --parlay-legs 3
        env:
          # DISCORD_WEBHOOK_WNBA added 2026-07-23 — this run is hardcoded
          # to --sport wnba, so only the one sport secret is needed here
          # (unlike morning_run.yml/daily_recap.yml which loop every
          # sport). edge_finder_alert.py routes to
          # get_webhook_for_sport("wnba") first, falling back to
          # DISCORD_WEBHOOK_PROPS below only if that's not set.
          DISCORD_WEBHOOK_WNBA: ${{ secrets.DISCORD_WEBHOOK_WNBA }}
          DISCORD_WEBHOOK_PROPS: ${{ secrets.DISCORD_WEBHOOK_PROPS }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
