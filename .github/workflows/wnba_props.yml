name: WNBA Player Props

on:
  schedule:
    - cron: '7 15 * * *'    # 10:07 AM CT daily — fetch today's props
    - cron: '22 15 * * *'   # 10:22 AM CT daily — send props alert (props already fetched)
  workflow_dispatch:

jobs:
  fetch_props:
    if: github.event.schedule == '7 15 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch today's props
        run: python fetch_prizepicks_props.py --sport wnba
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

  fetch_mlb_props:
    if: github.event.schedule == '7 15 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch today's MLB props
        run: python fetch_prizepicks_props.py --sport mlb
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

  props_alert:
    needs: fetch_props
    if: always() && (github.event.schedule == '22 15 * * *' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send props alert
        run: python wnba_props_alert.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
