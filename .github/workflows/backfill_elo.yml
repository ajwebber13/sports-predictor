name: Backfill Elo Ratings

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport to backfill (or 'all' for wnba/nba/nfl/ncaab/ncaaf)"
        required: true
        default: "wnba"

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill Elo from results
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python elo_ratings.py backfill "${{ github.event.inputs.sport }}"