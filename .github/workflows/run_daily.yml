name: Daily Sports Alerts

on:
  schedule:
    # 9:00 AM CT (CDT Mar–Nov = 14:00 UTC)
    # Update to '0 15 * * *' in November when clocks change
    - cron: '0 14 * * *'    # WNBA + NBA + NCAAB daily (in season)
    - cron: '0 14 * * 5'    # NCAAF Fridays
    - cron: '0 14 * * 4'    # NFL Thursdays

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  send_wnba_alerts:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '0 14 * * *' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send WNBA alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_daily.py wnba

  send_nba_alerts:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '0 14 * * *' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send NBA alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_daily.py nba

  send_ncaab_alerts:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '0 14 * * *' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send NCAAB alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_daily.py ncaab

  send_ncaaf_alerts:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '0 14 * * 5' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send NCAAF alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python telegram_alerts.py --sport ncaaf

  send_nfl_alerts:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '0 14 * * 4' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send NFL alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python telegram_alerts.py --sport nfl

  update_results:
    runs-on: ubuntu-latest
    needs: [send_wnba_alerts, send_nba_alerts, send_ncaab_alerts]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pull ESPN results and update record
        run: python results_tracker.py
      - name: Commit updated results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add results_log.json data/predictions/
          git diff --staged --quiet || git commit -m "Auto-update results [$(date +'%Y-%m-%d')]"
          git push
