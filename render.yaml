services:
  - type: web
    name: sports-predictor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  # ── NBA ─────────────────────────────────────────────────────
  # Games almost daily Oct-Jun, tip times noon through 10 PM CT
  - type: cron
    name: nba-morning
    runtime: python
    schedule: "0 15 * * *"   # 10 AM CT daily
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --sport nba
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: nba-afternoon
    runtime: python
    schedule: "0 21 * * *"   # 4 PM CT daily
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --sport nba
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  # ── WNBA ────────────────────────────────────────────────────
  # Games daily May-Oct, tip times noon through 9 PM CT
  - type: cron
    name: wnba-props-morning
    runtime: python
    schedule: "0 15 * * *"   # 10 AM CT daily — fetch PrizePicks props before alerts
    buildCommand: pip install -r requirements.txt
    startCommand: python fetch_prizepicks_props.py --sport wnba
    envVars:
      - key: ODDS_API_KEY
        sync: false

  - type: cron
    name: wnba-morning
    runtime: python
    schedule: "0 15 * * *"   # 10 AM CT daily
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --sport wnba
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: wnba-afternoon
    runtime: python
    schedule: "0 21 * * *"   # 4 PM CT daily
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --sport wnba
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  # ── NCAAB ───────────────────────────────────────────────────
  # Games almost daily Nov-Apr, tip times noon through 11 PM CT
  - type: cron
    name: ncaab-morning
    runtime: python
    schedule: "0 15 * * *"   # 10 AM CT daily
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --sport ncaab
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: ncaab-afternoon
    runtime: python
    schedule: "0 21 * * *"   # 4 PM CT daily
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --sport ncaab
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  # ── NCAAF ───────────────────────────────────────────────────
  # Saturday primary slate + Tue/Wed/Thu/Fri night games Aug-Jan
  - type: cron
    name: ncaaf-saturday
    runtime: python
    schedule: "0 14 * * 6"   # 9 AM CT Saturdays — full Saturday slate
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --sport ncaaf
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: ncaaf-weeknight
    runtime: python
    schedule: "0 22 * * 2,3,4,5"  # 5 PM CT Tue-Fri — mid-week night games
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --sport ncaaf
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  # ── NFL ─────────────────────────────────────────────────────
  # Sunday primary + Thursday Night + Monday Night Sep-Feb
  - type: cron
    name: nfl-sunday
    runtime: python
    schedule: "0 14 * * 0"   # 9 AM CT Sundays — catches 1 PM and 4 PM games
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --sport nfl
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: nfl-thursday
    runtime: python
    schedule: "0 22 * * 4"   # 5 PM CT Thursdays — Thursday Night Football
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --sport nfl
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: nfl-monday
    runtime: python
    schedule: "0 22 * * 1"   # 5 PM CT Mondays — Monday Night Football
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --sport nfl
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: wnba-closing-lines-early
    runtime: python
    schedule: "30 17 * * *"   # 11:30 AM CT daily — captures closing lines for 1 PM early games
    buildCommand: pip install -r requirements.txt
    startCommand: python capture_closing_lines.py --sport wnba
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: closing-lines-early-weekend
    runtime: python
    schedule: "30 17 * * 0,6"   # 11:30 AM CT Sat/Sun — NFL 1 PM + NCAAF noon closing lines
    buildCommand: pip install -r requirements.txt
    startCommand: python capture_closing_lines.py
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: wnba-closing-lines
    runtime: python
    schedule: "0 21 * * *"   # 4 PM CT daily — capture closing lines before 6:30 PM tip
    buildCommand: pip install -r requirements.txt
    startCommand: python capture_closing_lines.py --sport wnba
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: wnba-pregame
    runtime: python
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python wnba_pregame_alert.py
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: auto-results
    runtime: python
    schedule: "0 5 * * *"   # midnight CT daily
    buildCommand: pip install -r requirements.txt
    startCommand: python auto_results.py yesterday
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: wnba-daily-recap
    runtime: python
    schedule: "30 11 * * *"   # 6:30 AM CT daily
    buildCommand: pip install -r requirements.txt
    startCommand: python wnba_recap.py --daily
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: wnba-weekly-recap
    runtime: python
    schedule: "0 14 * * 0"   # 9 AM CT Sundays
    buildCommand: pip install -r requirements.txt
    startCommand: python wnba_recap.py --weekly
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
  - type: cron
    name: wnba-roster-sync
    runtime: python
    schedule: "0 6 * * 1"   # 1 AM CT Mondays � weekly roster sync
    buildCommand: pip install -r requirements.txt
    startCommand: python sync_wnba_rosters.py
    envVars:
      - key: ODDS_API_KEY
        sync: false
