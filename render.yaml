services:
  - type: web
    name: sports-predictor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: daily-alerts-morning
    runtime: python
    schedule: "0 17 * * *"   # 12 PM CT — NBA, NFL, NCAAF, NCAAB
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --exclude wnba
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: noon-retry
    runtime: python
    schedule: "0 19 * * *"   # 2 PM CT — retry missed morning picks (no WNBA)
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --retry --exclude wnba
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: daily-alerts-wnba-morning
    runtime: python
    schedule: "0 15 * * *"   # 10 AM CT — WNBA noon tip-offs
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --sport wnba
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false

  - type: cron
    name: daily-alerts-wnba-afternoon
    runtime: python
    schedule: "0 21 * * *"   # 4 PM CT — WNBA evening tip-offs
    buildCommand: pip install -r requirements.txt
    startCommand: python render_job.py --sport wnba
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false